<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="{{{ PRODUCT_NAME }}}">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-label="{{{ PRODUCT_NAME }}} WebGL application">
    <section id="game-shell">
      <canvas id="unity-canvas" tabindex="-1" aria-label="{{{ PRODUCT_NAME }}}"></canvas>

      <div id="loading-screen" role="status" aria-live="polite">
        <div class="loading-card">
          <div class="brand-row">
            <span class="brand-mark" aria-hidden="true"></span>
            <span id="loading-title">{{{ PRODUCT_NAME }}}</span>
          </div>
          <div class="loading-track">
            <div id="progress-fill"></div>
          </div>
          <div class="loading-meta">
            <span id="loading-status">Preparing your experience…</span>
            <span id="progress-value">0%</span>
          </div>
        </div>
      </div>

      <div id="error-message" role="alert" hidden></div>

      <div id="toolbar" aria-label="Game controls">
        <span id="game-title">{{{ PRODUCT_NAME }}}</span>
        <button id="fullscreen-button" type="button" aria-label="Enter fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Fullscreen</span>
        </button>
      </div>
    </section>
  </main>

  <script src="template.js"></script>
</body>
</html>
